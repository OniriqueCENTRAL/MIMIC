name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The last step leaves the logs of the run on a branch of their own.
permissions:
  contents: write

env:
  JUCE_TAG: 9.0.3

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            generator: Xcode
            artefacts: build/Mimic_artefacts/Release
          - name: Windows
            os: windows-latest
            artefacts: build/Mimic_artefacts/Release

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Fetch JUCE
        shell: bash
        run: git clone --depth 1 --branch "$JUCE_TAG" https://github.com/juce-framework/JUCE.git

      # No generator is named on Windows: whichever Visual Studio the runner
      # carries is the one to use, and naming last year's fails on a new image.
      - name: Configure
        shell: bash
        run: |
          set -o pipefail
          if [ "${{ matrix.name }}" = "Windows" ]; then
            cmake -B build -A x64 2>&1 | tee configure.log
          else
            cmake -B build -G "${{ matrix.generator }}" 2>&1 | tee configure.log
          fi

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 2>&1 | tee build.log

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build -C Release --output-on-failure 2>&1 | tee test.log

      # The interface as the plugin draws it, in several states (each source and waveform lit, frozen), kept with
      # the logs: what a change to the interface looks like, without a DAW.
      - name: Photograph the interface
        if: matrix.name == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          cmake --build build --config Release --target mimic_snapshot --parallel 2>&1 | tail -3
          mkdir -p shots
          S=build/Release/mimic_snapshot.exe
          [ -f "$S" ] || S=$(find build -name mimic_snapshot.exe | head -1)
          "$S" shots/repos.png
          for v in 0 1 2; do "$S" shots/source-$v.png --set input=0 --set source=$v; done
          for v in 0 1 2 3; do "$S" shots/onde-$v.png --set wave=$v; done
          "$S" shots/gel.png --freeze
          "$S" shots/grand-1415x768.png 1415 768 --set source=2 --set wave=3
          ls -la shots

      - name: Check the macOS binaries are universal
        if: matrix.name == 'macOS'
        run: |
          lipo -info "${{ matrix.artefacts }}/VST3/MIMIC.vst3/Contents/MacOS/MIMIC"
          lipo -info "${{ matrix.artefacts }}/AU/MIMIC.component/Contents/MacOS/MIMIC"

      # Apple's own validator loads the Audio Unit the way a host does and
      # puts it through its paces. The build has just installed it for this
      # user. A failure is reported, not fatal: the plugins are still wanted.
      - name: Validate the Audio Unit
        if: matrix.name == 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ls ~/Library/Audio/Plug-Ins/Components/ 2>&1 | tee auval.log
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aumu Mimc Onrq 2>&1 | tee -a auval.log

      # Zipped with ditto on macOS so the bundles keep their symlinks and
      # ad-hoc signature, which upload-artifact's own zip would flatten.
      - name: Package (macOS)
        if: matrix.name == 'macOS'
        run: |
          mkdir dist
          ditto -c -k --keepParent "${{ matrix.artefacts }}/VST3/MIMIC.vst3" dist/MIMIC-macOS-VST3.zip
          ditto -c -k --keepParent "${{ matrix.artefacts }}/AU/MIMIC.component" dist/MIMIC-macOS-AU.zip

      - name: Package (Windows)
        if: matrix.name == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path "${{ matrix.artefacts }}/VST3/MIMIC.vst3" -DestinationPath dist/MIMIC-Windows-VST3.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MIMIC-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

      # What happened, kept where it can be read without opening the run: the
      # errors, and the end of each log, on a branch that holds nothing else.
      - name: Leave the logs on a branch
        if: always()
        shell: bash
        run: |
          mkdir logs
          echo "${{ job.status }} - ${{ github.sha }} - $(date -u +%FT%TZ)" > logs/status.txt
          for f in configure.log build.log test.log auval.log; do
            [ -f "$f" ] || continue
            grep -n -E "error[: ]|Error:|FAIL|\*\* BUILD|AU VALIDATION|PASS" "$f" | head -200 > "logs/${f%.log}-errors.txt" || true
            tail -n 150 "$f" > "logs/${f%.log}-tail.txt"
          done
          ls dist > logs/artefacts.txt 2>/dev/null || true
          [ -d shots ] && cp -r shots logs/ || true
          cd logs
          git init -q
          git config user.name "build"
          git config user.email "build@users.noreply.github.com"
          git checkout -q -b "ci-logs-${{ matrix.name }}"
          git add -A
          git commit -q -m "Logs of ${{ github.sha }}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "HEAD:ci-logs-${{ matrix.name }}"

      # The built plugins themselves, on a branch that holds nothing else and
      # is replaced at every run: a way to fetch them with nothing but git.
      - name: Leave the plugins on a branch
        if: success()
        shell: bash
        run: |
          cd dist
          echo "${{ github.sha }} - $(date -u +%FT%TZ)" > BUILD.txt
          git init -q
          git config user.name "build"
          git config user.email "build@users.noreply.github.com"
          git checkout -q -b "ci-build-${{ matrix.name }}"
          git add -A
          git commit -q -m "Build of ${{ github.sha }}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "HEAD:ci-build-${{ matrix.name }}"
