<style>
/* Layout: une scène 3D (bois de coffre, fer, clous, lumières) vue de face en projection orthographique, avec l'interface 2D posée par-dessus à l'identique. Clavier et état en dessous. */
:root {
  --night: #0D0809;
  --ember: #E23444;
  --blood: #5C0008;
  --bone: #FFECEE;
  --iron-4: #7d6a70;
  --font-display: "Grenze Gotisch", "UnifrakturMaguntia", "Old English Text MT", "Cinzel Decorative", "Cinzel", "Trajan Pro", Georgia, serif;
  --font-serif: "Cinzel", "Trajan Pro", Georgia, serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --font-rune: "Noto Sans Runic", "Segoe UI Historic", "Noto Sans Symbols", serif;
  --stone: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='360' height='360'><filter id='s' x='0' y='0' width='100%25' height='100%25'><feTurbulence type='fractalNoise' baseFrequency='.03 .036' numOctaves='5' seed='11' stitchTiles='stitch' result='n'/><feDiffuseLighting in='n' surfaceScale='2.8' diffuseConstant='1' lighting-color='%23c2b6b9'><feDistantLight azimuth='235' elevation='56'/></feDiffuseLighting></filter><rect width='100%25' height='100%25' filter='url(%23s)'/></svg>");
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
html.plugin, html.plugin body { height: 100%; overflow: hidden; }
html.plugin body { padding: 0; }
html.plugin .wrap { max-width: none; }
html.plugin .keys-wrap { display: none; }
body { background: #070607; color: var(--bone); font-family: var(--font-mono); font-size: 12px; padding-inline: 16px; padding-block: 20px; }
.wrap { max-width: 1180px; margin-inline: auto; }
.viewport { position: relative; width: 100%; overflow: hidden; }

.stage { position: absolute; left: 0; top: 0; width: 1024px; height: 572px; transform-origin: 0 0; overflow: visible; user-select: none; -webkit-user-select: none; background: #0b0708; }
.stage.nogl .glc { display: none; }
.glc { position: absolute; left: 0; top: 0; width: 1024px; height: 572px; pointer-events: none; }
.abs { position: absolute; }
.fallback { display: none; left: 45px; top: 58px; width: 935px; height: 504px; background-size: 100% 100%; border: 4px solid #0e0a0b; box-shadow: 0 0 0 2px #000, inset 0 0 60px #000; }
.stage.nogl .fallback { display: block; }
#cavFallback { display: block; left: 275px; top: 165px; width: 483px; height: 180px; z-index: 2; }
.maw-img { z-index: 3; left: 219.5px; top: 138px; width: 585px; height: 232px; pointer-events: none; filter: drop-shadow(0 6px 8px rgba(0,0,0,.7)); }
.maw-glow { z-index: 3; left: 219.5px; top: 138px; width: 585px; height: 232px; pointer-events: none; mix-blend-mode: screen; opacity: .3; background: radial-gradient(ellipse 52% 55% at 50% 52%, rgba(226,52,68,.55), rgba(226,52,68,.18) 55%, transparent 80%); }
.maw-rn { display: none; }

/* Fentes lumineuses */
.slot { z-index: 5; top: 82px; height: 28px; border-radius: 3px; background: linear-gradient(180deg, #050203, #1a080b); border: 1px solid #000; box-shadow: inset 0 0 0 1px rgba(255,236,238,.07), 0 0 14px rgba(226,52,68,.4), 2px 3px 4px rgba(0,0,0,.7); overflow: hidden; }
.slot::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(226,52,68,0), rgba(226,52,68,.6) 55%, rgba(255,130,110,.9)); opacity: .55; }
.slot.r::before { background: linear-gradient(270deg, rgba(226,52,68,0), rgba(226,52,68,.6) 55%, rgba(255,130,110,.9)); }
.seg { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; z-index: 1; }
.seg button { flex: 1; font: 700 9px var(--font-serif); letter-spacing: .06em; text-transform: uppercase; color: rgba(255,236,238,.5); background: transparent; border: 0; border-left: 1px solid rgba(0,0,0,.7); padding: 0 3px; cursor: pointer; }
.seg button:first-child { border-left: 0; }
.seg button:hover { color: var(--bone); }
.seg button[aria-pressed="true"] { color: #fff; background: linear-gradient(180deg, rgba(226,52,68,.62), rgba(150,12,28,.85)); text-shadow: 0 0 6px #fff, 0 0 12px #E23444, 0 0 20px #E23444; box-shadow: inset 0 0 0 1px #E23444, inset 0 0 14px rgba(255,90,100,.7), inset 0 -2px 0 #ff8a94; }
.seg button svg { width: 18px; height: 10px; display: block; margin: auto; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.slot.osc::before { opacity: .35; }
.freeze { position: absolute; inset: 0; z-index: 1; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; background: transparent; border: 0; color: var(--bone); font: 700 10px var(--font-serif); letter-spacing: .12em; white-space: nowrap; text-shadow: 0 0 8px rgba(0,0,0,.8); }
.freeze[aria-pressed="true"] { background: rgba(0,0,0,.45); text-shadow: 0 0 10px var(--bone), 0 0 18px var(--ember); }
.gem { width: 10px; height: 10px; transform: rotate(45deg); background: #2a0509; border: 1px solid #000; box-shadow: inset 0 0 2px #000; transition: background .06s, box-shadow .06s; flex: none; }
.gem.on, .freeze[aria-pressed="true"] .gem { background: var(--bone); box-shadow: 0 0 10px var(--bone), 0 0 22px var(--ember); }
button:focus-visible, .dial:focus-visible, .key:focus-visible { outline: 2px solid var(--bone); outline-offset: 2px; }

/* Plaque de titre */
.plate-wrap { left: 378px; top: 60px; width: 269px; height: 96px; filter: drop-shadow(3px 6px 4px rgba(0,0,0,.9)); z-index: 4; }
.plate-svg { position: absolute; left: 0; top: 0; width: 269px; height: 96px; overflow: visible; }
.eyebrow { position: absolute; left: 0; right: 0; top: 11px; text-align: center; font: 700 12.5px var(--font-serif); letter-spacing: .16em; color: #a99a98; text-shadow: 0 1px 0 rgba(0,0,0,.95), 0 -1px 0 rgba(255,236,238,.12); }
/* La marque du partenariat, la même que dans RAW : une capsule lumineuse, ONIRIQUE en capitales espacées, abrasion en minuscules rondes. */
.xcredit { left: 50%; right: auto; top: 6px; transform: translateX(-50%); display: inline-flex; align-items: center; gap: .45em; padding: 3px 10px 3px 11px; border: 1px solid rgba(226,52,68,.48); border-radius: 999px; background: rgba(28,8,11,.72); box-shadow: 0 0 10px rgba(226,52,68,.24), inset 0 0 9px rgba(226,52,68,.10); white-space: nowrap; letter-spacing: 0; text-shadow: none; }
.xcredit b { font-weight: 800; font-size: 9.5px; line-height: 1; }
.xcredit .x-oni { font-family: "Unbounded", "Arial Black", sans-serif; letter-spacing: .14em; color: #f6eeee; text-shadow: 0 0 7px rgba(226,52,68,.7); }
.xcredit .x-abr { font-family: "Fredoka", "Unbounded", sans-serif; font-weight: 700; font-size: 10.5px; text-transform: lowercase; color: #f6eeee; text-shadow: 0 0 7px rgba(246,238,238,.75); }
.xcredit i { font-style: normal; font-size: 8.5px; color: #a88f92; }
.title { position: absolute; left: 0; right: 0; top: 24px; text-align: center; font: 900 56px/1 var(--font-display); letter-spacing: 4px; padding-left: 4px; color: transparent; background: linear-gradient(180deg, #fff4dc 0%, #ffb08a 22%, #ff4a50 48%, #d0202f 72%, #7a0a16 100%); -webkit-background-clip: text; background-clip: text; filter: url(#titleF) drop-shadow(0 2px 0 #120203) drop-shadow(0 0 3px rgba(255,70,60,.9)) drop-shadow(0 0 9px rgba(226,52,68,.7)) drop-shadow(0 0 20px rgba(226,52,68,.4)); animation: flick 3.4s infinite; }
@keyframes flick { 0%, 100% { opacity: 1; } 47% { opacity: .94; } 52% { opacity: 1; } 64% { opacity: .97; } }
.prn { position: absolute; top: 20px; font: 400 12px/17px var(--font-rune); color: #7a2a30; text-shadow: 0 1px 0 rgba(255,200,190,.15), 0 -1px 0 #000; }
.prn.l { left: 11px; } .prn.r { right: 11px; }
.plate-gem { position: absolute; bottom: 7px; width: 6px; height: 6px; transform: rotate(45deg); background: radial-gradient(circle at 35% 30%, #ffb0b4, #E23444 55%, #5C0008); border: 1px solid #000; }
.eng { font: 400 13px var(--font-rune); letter-spacing: .5em; color: rgba(150,125,115,.5); text-shadow: 0 1px 0 rgba(0,0,0,.95), 0 -1px 0 rgba(255,236,238,.08); white-space: nowrap; }
.sigil { filter: drop-shadow(2px 3px 2px rgba(0,0,0,.8)); }
.orn { z-index: 6; pointer-events: none; filter: drop-shadow(4px 6px 4px rgba(0,0,0,.8)); }

/* Vumètres : les segments sont en 3D, seuls les libellés restent en HTML */
.meter { top: 163px; width: 52px; height: 190px; text-align: center; pointer-events: none; }
.meter .lab { position: absolute; left: 0; right: 0; font: 700 9px var(--font-serif); letter-spacing: .1em; color: #d8c8c2; text-shadow: 0 1px 0 #000, 0 0 5px rgba(0,0,0,.9); }
.meter .lab.t { top: 0; } .meter .lab.b { bottom: 2px; }
.clipgem { position: absolute; left: 50%; margin-left: -5px; top: 14px; z-index: 2; }
.maw-rn { top: 171px; font: 400 11px var(--font-rune); letter-spacing: .45em; color: rgba(255,236,238,.6); z-index: 3; text-shadow: 0 0 5px var(--ember), 0 1px 0 #000; }

/* Sceaux : corps en 3D, zone de prise et libellés en HTML */
.knob { position: absolute; top: 366px; width: 140px; height: 186px; }
.kn-body { position: absolute; left: -10px; top: 9px; width: 160px; height: 160px; pointer-events: none; filter: drop-shadow(3px 6px 4px rgba(0,0,0,.85)); }
.kn-ring { position: absolute; left: -10px; top: 9px; width: 160px; height: 160px; pointer-events: none; overflow: visible; }
.kn-ring line { stroke-width: 2.2; stroke-linecap: butt; }
.kn-ring .off { stroke: #34363c; filter: drop-shadow(0 1px 0 rgba(255,235,220,.14)); }
.kn-ring .on { stroke: #E23444; filter: drop-shadow(0 0 2px rgba(226,52,68,.95)); }
.kn-needle { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; }
.kn-needle .nd { position: absolute; left: -6px; top: -50px; width: 12px; height: 23px; clip-path: polygon(50% 0, 100% 22%, 100% 100%, 0 100%, 0 22%); background: linear-gradient(90deg, #17120f 0%, #a7a9b3 38%, #eceef4 48%, #5a5b64 58%, #17120f 100%); filter: drop-shadow(1px 3px 1px rgba(0,0,0,.9)); }
.kn-needle .nd::after { content: ""; position: absolute; left: 5px; top: 6px; width: 2px; height: 12px; background: #E23444; box-shadow: 0 0 4px #E23444; }
.kn-name { position: absolute; left: 0; right: 0; top: 4px; text-align: center; font: 700 15px var(--font-serif); letter-spacing: .1em; color: #eadddf; text-shadow: 0 1px 0 #000, 0 0 8px rgba(0,0,0,.9); }
.dial { position: absolute; left: 10px; top: 29px; width: 120px; height: 120px; touch-action: none; cursor: ns-resize; border-radius: 50%; }
.dial.cssknob { background: radial-gradient(circle at 38% 30%, #5a4a50, #1b1416 70%); box-shadow: 0 0 0 4px #1d0a0e, 0 0 10px rgba(226,52,68,.5); }
.dial.cssknob i { position: absolute; left: 50%; top: 14px; width: 3px; height: 26px; margin-left: -1.5px; background: var(--bone); transform-origin: 50% 46px; border-radius: 2px; }
.kn-v { position: absolute; left: 50%; top: -4px; transform: translate(-50%, -100%); font: 600 11px var(--font-mono); letter-spacing: .06em; white-space: nowrap; padding: 3px 8px; border-radius: 3px; background: #070304; color: var(--bone); border: 1px solid var(--ember); box-shadow: 0 0 10px rgba(226,52,68,.55); opacity: 0; pointer-events: none; transition: opacity .12s; z-index: 5; }
.dial:hover .kn-v, .dial:focus-visible .kn-v, .dial.active .kn-v { opacity: 1; }
.bd { position: absolute; top: 120px; width: 28px; height: 28px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #4d3d42, #140e10 70%); border: 2px solid #050304; box-shadow: 0 0 0 1px rgba(226,52,68,.6), inset 0 0 7px rgba(226,52,68,.5), 0 0 10px rgba(226,52,68,.35), 2px 3px 3px rgba(0,0,0,.7); text-align: center; font: 400 14px/24px var(--font-rune); color: #e0707a; text-shadow: 0 0 6px var(--ember); }
.bd.l { left: 6px; } .bd.r { left: 106px; }
.vig { left: 45px; top: 58px; width: 935px; height: 504px; border-radius: 8px; pointer-events: none; background: radial-gradient(ellipse at 50% 48%, transparent 30%, rgba(2,0,4,.5) 70%, rgba(0,0,0,.85) 100%), linear-gradient(180deg, rgba(20,30,60,.10), rgba(40,0,10,.14)); z-index: 9; }

/* ====== Sous la scène ====== */
.keys-wrap { margin-top: 18px; padding: 14px 16px 16px; border-radius: 10px; background: var(--stone), linear-gradient(180deg, #2a2124, #100b0c); background-blend-mode: multiply, normal; border: 1px solid #000; box-shadow: 0 0 0 1px #3b2f33, inset 0 0 24px #000; }
.keys-head { display: flex; justify-content: space-between; align-items: baseline; gap: 6px 14px; flex-wrap: wrap; margin-bottom: 10px; }
.tag { font: 700 10px var(--font-serif); letter-spacing: .22em; text-transform: uppercase; color: var(--iron-4); }
.keys { position: relative; display: flex; height: 84px; border-radius: 4px; overflow: hidden; border: 1px solid #000; box-shadow: 0 4px 14px #000; touch-action: none; user-select: none; }
.key { flex: 1; min-width: 0; border: 0; border-right: 1px solid #000; background: linear-gradient(180deg, #d9cfd1, #a89da0); color: #2a1a1d; font: 600 10px var(--font-mono); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; cursor: pointer; }
.key:last-child { border-right: 0; }
.key.on { background: linear-gradient(180deg, #ff9aa4, var(--ember)); color: var(--bone); box-shadow: inset 0 0 18px rgba(92,0,8,.6); }
.key.blk { position: absolute; top: 0; width: 5.8%; height: 58%; flex: none; z-index: 2; background: linear-gradient(180deg, #221a1c, #070405); color: var(--iron-4); border: 1px solid #000; border-radius: 0 0 4px 4px; padding-bottom: 4px; }
.key.blk.on { background: linear-gradient(180deg, #8a1822, var(--ember)); color: var(--bone); }
.status { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 14px; font-size: 10px; letter-spacing: .1em; color: var(--iron-4); text-transform: uppercase; }
.status b { color: var(--bone); font-weight: 600; }
.status .hot { color: var(--ember); }
@media (max-width: 560px) { .keys { height: 70px; } }
@media (prefers-reduced-motion: reduce) { .kn-v, .gem { transition: none; } .title { animation: none; } }
</style>
